version: "3.9"

services:
  # ─────────────────────────────────────────────────────────
  # FastAPI Main Backend Server (Unified API & ML Engine)
  # ─────────────────────────────────────────────────────────
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - BASE_URL=http://localhost:8001
    volumes:
      - ./server:/app

  # ─────────────────────────────────────────────────────────
  # Next.js Frontend Client
  # ─────────────────────────────────────────────────────────
  web:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8001
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - api
